[project]
name = "graphrag-intelligence-lab"
version = "0.0.0"
description = "Glass-box GraphRAG engine, teaching lab and benchmark harness"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.30.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "greenlet>=3.1.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "litellm>=1.108.0",
    "neo4j>=6.4.1",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-sdk>=1.45.1",
    "psycopg-binary>=3.3.8",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.20.0",
    "redis>=8.1.0",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires live containers",
    "eval: golden-set evaluation",
    "security: ACL leak and prompt-injection tests",
]
